; 单次回测（真实 tick）。用法见 run_mt5.sh
[Common]
Login=你的模拟账号
Password=你的密码
Server=MetaQuotes-Demo

[Tester]
Expert=XAU_Scalper
ExpertParameters=XAU_Scalper_opt.set
Symbol=XAUUSD
Period=M1
; Model: 0=每个tick(生成) 1=1分钟OHLC 2=仅开盘价 3=数学计算 4=基于真实tick的每个tick
Model=4
; ExecutionMode: 0=无延迟 -1=随机延迟 >0=固定毫秒延迟。剥头皮务必用延迟模拟滑点/重新报价
ExecutionMode=-1
Optimization=0
FromDate=2026.07.01
ToDate=2026.10.01
ForwardMode=0
Deposit=10000
Currency=USD
Leverage=500
Report=reports\xs_single
ReplaceReport=1
ShutdownTerminal=1
