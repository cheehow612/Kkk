; Walk-Forward 单个窗口模板：run_wfo.sh 会替换 __FROM__ / __FWD__ / __TO__ / __NAME__
; 训练段 = [FromDate, ForwardDate)，测试段 = [ForwardDate, ToDate]
[Common]
Login=你的模拟账号
Password=你的密码
Server=MetaQuotes-Demo

[Tester]
Expert=XAU_Scalper
ExpertParameters=XAU_Scalper_opt.set
Symbol=XAUUSD
Period=M1
Model=4
ExecutionMode=-1
; Optimization: 0=关闭 1=慢速完整 2=快速遗传算法
Optimization=2
; OptimizationCriterion: 6=自定义最大值（即 OnTester 返回值）
OptimizationCriterion=6
FromDate=__FROM__
ToDate=__TO__
; ForwardMode=4 自定义前推起始日；优化器会自动把训练段最优的一批参数在测试段重跑
ForwardMode=4
ForwardDate=__FWD__
Deposit=10000
Currency=USD
Leverage=500
Report=reports\__NAME__
ReplaceReport=1
ShutdownTerminal=1
